bio: >
  Bacharel em Ciências Econômicas pela Universidade Federal do Delta do Parnaíba (UFDPar). Atuo com pesquisa quantitativa aplicada em macroeconomia, economia monetária, economia regional e métodos de ciência de dados.

bio_en: >
  B.A. in Economics from the Federal University of Delta do Parnaíba (UFDPar). Quantitative research in applied macroeconomics, monetary economics, regional economics, and data science methods.

bio_es: >
  Licenciado en Ciencias Económicas por la Universidad Federal del Delta del Parnaíba (UFDPar). Investigación cuantitativa aplicada en macroeconomía, economía monetaria, economía regional y ciencia de datos.

bio_de: >
  B.A. in Wirtschaftswissenschaften an der Bundesuniversität Delta do Parnaíba (UFDPar). Empirische Forschung in Makroökonomie, Geldpolitik, Regionalökonomie und Data-Science-Methoden.

