courses:
  - id: "macroeconomia-ii"
    name: "Macroeconomia II"
    code: "DCE0034"
    institution: "Universidade Federal do Delta do Parnaíba (UFDPar)"
    level: "Graduação em Ciências Econômicas"
    period: "2024.2 / 2025.1"
    role: "Monitor Bolsista"
    description: >
      Fundamentos da contabilidade social, determinação do produto e emprego no curto prazo, modelo clássico, modelo keynesiano simples, equilíbrio conjunto IS-LM e introdução à economia aberta (Mundell-Fleming).
    syllabus:
      - "1. Apresentação da disciplina e o Balanço de Pagamentos"
      - "2. Aspectos de uma economia aberta"
      - "3. Modelo Mundell-Fleming"
      - "4. Modelo de OA-DA"
      - "5. Curva de Phillips original"
      - "6. Taxa natural de desemprego e Curva de Phillips tradicional"
      - "7. Expectativas adaptativas"
      - "8. A visão monetarista da Curva de Phillips"
      - "9. Expectativas Racionais"
      - "10. Inconsistência temporal"
    materials:
      - title: "Notas de Monitoria — Completo"
        type: "PDF"
        url: "assets/teaching/Material_Macro_II_Completo.pdf"
        description: "Resoluções das Listas"

  - id: "macroeconomia-iii"
    name: "Macroeconomia III"
    code: "ECO0204"
    institution: "Universidade Federal do Delta do Parnaíba (UFDPar)"
    level: "Graduação em Ciências Econômicas"
    period: "2024.1"
    role: "Monitor auxiliar"
    description: >
      Modelos de médio e longo prazo: Modelo de Oferta e Demanda Agregada (OA-DA), curva de Phillips, expectativas racionais, microfundamentos do consumo e teoria do crescimento neoclássico (Solow-Swan).
    syllabus:
      - "1. O Modelo de Oferta e Demanda Agregada (OA-DA) e Choques de Oferta"
      - "2. A Curva de Phillips: Inflação, Desemprego e Formação de Expectativas"
      - "3. Microfundamentação do Consumo: Renda Permanente e Ciclo de Vida"
      - "4. Teoria do Investimento: Custo de Ajuste e q de Tobin"
      - "5. Teoria do Crescimento Neoclássico: Modelo de Solow-Swan e Regra de Ouro"
      - "6. Contabilidade do Crescimento e Resíduo de Solow"
    materials:
      - title: "Notas de Monitoria — Completo"
        type: "PDF"
        url: "assets/teaching/Material_Macro_III_Completo.pdf"
        description: "Resoluções das Listas"
      

