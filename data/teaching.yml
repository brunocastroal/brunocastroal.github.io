courses:
  - id: "macroeconomia-ii"
    name: "Macroeconomia II"
    code: "DCE0034"
    institution: "Universidade Federal do Delta do Parnaíba (UFDPar)"
    level: "Graduação em Ciências Econômicas"
    period: "2024.2 / 2025.1"
    role: "Monitor Bolsista"
    description: >
      Estudo da macroeconomia aberta, do balanço de pagamentos e dos modelos Mundell-Fleming e OA-DA, além das teorias da Curva de Phillips, expectativas adaptativas e racionais, monetarismo e inconsistência temporal.
    syllabus:
      - "1. Apresentação da disciplina e o Balanço de Pagamentos"
      - "2. Aspectos de uma economia aberta"
      - "3. Modelo Mundell-Fleming"
      - "4. Modelo de OA-DA"
      - "5. Curva de Phillips original"
      - "6. Taxa natural de desemprego e Curva de Phillips tradicional"
      - "7. Expectativas adaptativas"
      - "8. A visão monetarista da Curva de Phillips"
      - "9. Expectativas Racionais"
      - "10. Inconsistência temporal"
    materials:
      - title: "Notas de Monitoria — Completo"
        type: "PDF"
        url: "assets/teaching/Material_Macro_II_Completo.pdf"
        description: "Resoluções das Listas"

  - id: "macroeconomia-iii"
    name: "Macroeconomia III"
    code: "ECO0204"
    institution: "Universidade Federal do Delta do Parnaíba (UFDPar)"
    level: "Graduação em Ciências Econômicas"
    period: "2024.1"
    role: "Monitor auxiliar"
    description: >
      Estudo dos ciclos econômicos, dos modelos novo-keynesianos e reais de negócios, e das teorias de crescimento econômico, incluindo os modelos de Solow, capital humano, progresso tecnológico, convergência de renda e crescimento endógeno.
    syllabus:
     - "1. Introdução à Macroeconomia e aos Ciclos Econômicos"
     - "2. Ciclos Econômicos: Conceitos, Características e Flutuações da Atividade Econômica"
     - "3. O Ciclo dos Estoques"
     - "4. Teoria dos Ciclos Econômicos Reais (RBC)"
     - "5. O Modelo Novo-Keynesiano de Ciclos Econômicos"
     - "6. Fatos Estilizados sobre o Crescimento Econômico"
     - "7. O Modelo Básico de Solow: Acumulação de Capital e Estado Estacionário"
     - "8. Progresso Tecnológico e o Modelo de Solow"
     - "9. Decomposição do Crescimento Econômico e Resíduo de Solow"
     - "10. O Modelo de Solow com Capital Humano"
     - "11. Convergência de Renda: Convergência Absoluta, Condicional e Divergência entre Economias"
     - "12. Modelos de Crescimento Endógeno"
    materials:
      - title: "Notas de Monitoria — Completo"
        type: "PDF"
        url: "assets/teaching/Material_Macro_III_Completo.pdf"
        description: "Resoluções das Listas"
      

