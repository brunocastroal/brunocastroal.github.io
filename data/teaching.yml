    syllabus: "Macroeconomia Aberta: Regimes cambiais e Balanço de Pagamentos; Modelo de determinação da renda em economia aberta; o modelo clássico e o modelo IS/LM/BP; Determinação dos equilíbrios interno e externo e impacto das políticas econômicas sob diferentes regimes cambiais e mobilidade de capitais. Modelos de oferta agregada/demanda agregada. Inflação, desemprego e curva de Phillips. O papel das expectativas racionais e adaptativas. Macroeconomia Kaleckiana: a distribuição e os determinantes da renda nacional."

  - period: "2024.2"
    course: "Macroeconomia III"
    code: "DCEQUANT/CMRV026"
    workload: "60h"
    institution: "UFDPar"
    role: "Monitor Auxiliar"
    description: "Plantões presenciais de dúvidas, elaboração de notas de apoio, resolução de listas e apoio ao docente na atualização de materiais."
    syllabus: "Conceitos básicos do crescimento econômico. O Processo de Crescimento Econômico e os problemas da acumulação. A tendência a longo prazo. Os fatores do crescimento: investimento, poupança, crescimento populacional, progresso técnico e inovação. Modelo de Harrod e Domar. O modelo de Kaldor. O modelo de Solow e a convergência de rendas. A nova teoria do crescimento e a não convergência de rendas. O modelo de Arrow. O modelo AK. O Modelo de Romer e P&D. Modelo de Lucas e o capital humano. Os modelos da Cepal (Prebisch, Hirschman, Myrdal e Furtado). Teorias do ciclo econômico (Ciclo de negócios e ciclos de Kondratiev, os ciclos no modelo clássico, choques tecnológicos e desemprego voluntário. Os ciclos no modelo keynesiano preços rígidos e salário eficiência). Flutuações e estabilização."

  - period: "2023.2"
    course: "Macroeconomia I"
    code: "DCEQUANT/CMRV018"
    workload: "60h"
    institution: "UFDPar"
    role: "Monitor Bolsista"
    description: "Plantões presenciais de dúvidas, elaboração de notas de apoio, resolução de listas e apoio ao docente na atualização de materiais."
    syllabus: "Conceitos básicos de Macroeconomia. Modelo Clássico: a lei de Say e a Teoria Quantitativa da Moeda; determinação da renda de equilíbrio de pleno emprego; poupança, investimento e taxa de juros; modelo clássico com procura especulativa de moeda; obstáculos ao pleno emprego e as políticas econômicas; análise gráfica do modelo Clássico; Keynes e os Clássicos. Modelo Keynesiano: Princípio da demanda efetiva; Consumo, determinação do investimento e eficiência marginal do capital; papel do Governo e do Setor Externo; Multiplicadores. As políticas econômicas no modelo Keynesiano. Modelo IS-LM: equilíbrio no mercado de bens e financeiro. Políticas econômicas no modelo IS-LM. Dedução da demanda agregada. Efeito Pigou e Efeito Fisher. Tópicos especiais de Macroeconomia."

  - period: "2023.1"
