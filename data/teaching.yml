    code: "DCEQUANT/CMRV002"
    workload: "60h"
    institution: "UFDPar"
    role: "Monitor Voluntário"
    description: "Plantões presenciais de dúvidas, elaboração de notas de apoio, resolução de listas e apoio ao docente na atualização de materiais."
    syllabus: "Objeto da economia. Evolução do Pensamento Econômico. Introdução à Microeconomia: fundamentos e divisão. Equilíbrio de mercado, Elasticidade, Estruturas de mercado. Noções gerais de macroeconomia: fundamentos e políticas macroeconômicas. Introdução ao Desenvolvimento Regional Sustentável. Aplicações."
