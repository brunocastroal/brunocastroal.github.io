<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Visual de economia regional e ciência de dados</title>
  <desc id="desc">Composição abstrata com gráfico de barras, pontos, linhas e áreas geográficas.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset=".45" stop-color="#f5f8ef"/>
      <stop offset="1" stop-color="#fdf7f2"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#dbe3ea" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#344054" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#paper)"/>
  <rect width="1600" height="720" fill="url(#grid)" opacity=".55"/>

